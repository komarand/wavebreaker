services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kaggle_research_postgres
    environment:
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: researcher
      POSTGRES_DB: kaggle_research
    ports:
    - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher -d kaggle_research"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: