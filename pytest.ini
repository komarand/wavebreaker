[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
markers =
    unit: fast offline unit and smoke tests that do not need external services
    integration: opt-in PostgreSQL/pgvector integration tests
    slow: tests that are intentionally slower or may download/use large models
    network: opt-in tests that call live external services
    contract: deterministic producer-consumer contract and reference tests
    offline: tests guaranteed not to access network or external services
    pipeline_smoke: internal pipeline smoke tests with external boundaries mocked
    manifest_migration: deterministic legacy run-manifest migration and resume tests
