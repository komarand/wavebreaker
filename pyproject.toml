[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-researcher"
version = "0.1.0"
description = "Kaggle competition research assistant with hybrid retrieval and reasoning agents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "KaggleResearcher" }
]

dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "kaggle>=1.6.14,<2.0.0",
    "arxiv>=2.1.0,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "pgvector>=0.3.2,<1.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "sentence-transformers>=3.0.0",
    "accelerate>=0.30.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kaggle_researcher*", "kaggle_eda_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "contract: deterministic producer-consumer contract and reference tests",
    "offline: tests guaranteed not to access network or external services",
    "pipeline_smoke: internal pipeline smoke tests with external boundaries mocked",
    "manifest_migration: deterministic legacy run-manifest migration and resume tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
